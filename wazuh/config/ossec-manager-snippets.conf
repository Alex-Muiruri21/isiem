<!--
  ISIEM additions for the MANAGER's /var/ossec/etc/ossec.conf
  Paste each block inside the top-level <ossec_config> ... </ossec_config>.
  Then: sudo systemctl restart wazuh-manager

  NOTE: do not add <expect> to the <command> blocks. It is deprecated since Wazuh
  4.2 and ignored (analysisd logs "The <expect> tag is deprecated"); 4.x passes the
  whole alert as JSON on stdin and the scripts read data.src_ip from it.

  Prereqs already placed on the manager:
    /var/ossec/etc/rules/isiem_rules.xml
    /var/ossec/etc/decoders/isiem_decoders.xml
  And on EVERY endpoint + the manager:
    /var/ossec/active-response/bin/block_ip.py     (chmod 750, root:wazuh)
    /var/ossec/active-response/bin/lock_account.py
    /var/ossec/active-response/bin/notify_admin.py
-->

<!-- 1. Re-ingest the ML engine's verdicts so they appear on the dashboard and
        can fire rules 100050-100052. VERDICT_LOG in ml_engine.py. -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/isiem/ml_verdicts.json</location>
</localfile>

<!-- 2. Define the three response commands. Wazuh 4.x passes the alert as JSON on
        stdin; our scripts read it from there. -->
<command>
  <name>isiem-block-ip</name>
  <executable>block_ip.py</executable>
  <timeout_allowed>yes</timeout_allowed>
</command>

<command>
  <name>isiem-lock-account</name>
  <executable>lock_account.py</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<command>
  <name>isiem-notify-admin</name>
  <executable>notify_admin.py</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<!-- 3. Attach responses to the critical ML rules.
        The ML verdict alerts are produced on the MANAGER (it reads the verdict log),
        so location=local would run the script on the manager only. Containment
        therefore uses location=all: the attacker IP is blocked on every agent, and
        an account lock is applied wherever that account exists. The scripts'
        whitelists stop them touching lab infrastructure. Email runs once, on the
        manager (local). The block auto-expires after 600s for easy lab resets. -->
<active-response>
  <command>isiem-block-ip</command>
  <location>all</location>
  <rules_id>100051,100052</rules_id>
  <timeout>600</timeout>
</active-response>

<!-- 3b. ALSO run the block on the manager itself (location=server).
         location=all sends the response to the agents only, so the BLOCKED line
         lands in each endpoint's own active-responses.log. measure.py runs on the
         manager and reads the manager's log, so without this block every run reads
         "NOT CONTAINED" even when the endpoints did block. Verified live: with only
         location=all, endpoint-1 logged BLOCKED while the manager log stayed empty.
         Side effect: an SSH session from Kali into the manager drops for 600s after
         a block; use the manager's VM console during runs. -->
<active-response>
  <command>isiem-block-ip</command>
  <location>server</location>
  <rules_id>100051,100052</rules_id>
  <timeout>600</timeout>
</active-response>

<active-response>
  <command>isiem-lock-account</command>
  <location>all</location>
  <rules_id>100051</rules_id>
</active-response>

<active-response>
  <command>isiem-notify-admin</command>
  <location>local</location>
  <rules_id>100051,100052</rules_id>
</active-response>
